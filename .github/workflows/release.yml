name: Release

# Builds unsigned installers for Linux, macOS and Windows and attaches them to
# a GitHub Release whenever a `v*` tag is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build and upload assets for, e.g. v0.6.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: seedvault
      - uses: actions/checkout@v4
        with:
          repository: gearcat0/evm-ui
          path: evm-ui

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build evm-ui
        working-directory: evm-ui
        run: |
          npm ci
          npm run build

      - name: Install
        working-directory: seedvault
        run: npm ci

      - name: Test
        working-directory: seedvault
        run: npm test

      - name: Build renderer
        working-directory: seedvault
        run: npm run build

      - name: Package
        working-directory: seedvault
        env:
          # Unsigned for now: no code-signing identity on any platform.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      # Uploaded by action-gh-release rather than electron-builder's own
      # publisher, whose HTTP client times out on 100 MB+ assets.
      - name: Attach installers to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            seedvault/release/*.AppImage
            seedvault/release/*.deb
            seedvault/release/*.dmg
            seedvault/release/*.exe
            seedvault/release/*.blockmap
            seedvault/release/latest*.yml
