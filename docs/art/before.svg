<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="420" rx="16" fill="#e9e2d3"/>
  <!-- desk texture -->
  <rect x="0" y="360" width="600" height="60" fill="#d8cfbc"/>

  <!-- torn notebook page -->
  <g transform="translate(60 70) rotate(-9)" filter="url(#sh)">
    <path d="M0 0 H210 V250 L200 262 L190 250 L178 264 L166 250 L150 266 L136 250 L120 262 L104 250 L88 264 L72 250 L58 262 L40 250 L26 266 L12 250 L0 258 Z" fill="#fbf8ee"/>
    <g stroke="#c9d5e8" stroke-width="1">
      <line x1="0" y1="40" x2="210" y2="40"/><line x1="0" y1="70" x2="210" y2="70"/><line x1="0" y1="100" x2="210" y2="100"/>
      <line x1="0" y1="130" x2="210" y2="130"/><line x1="0" y1="160" x2="210" y2="160"/><line x1="0" y1="190" x2="210" y2="190"/><line x1="0" y1="220" x2="210" y2="220"/>
    </g>
    <line x1="26" y1="0" x2="26" y2="258" stroke="#e8b4b4" stroke-width="1"/>
    <g fill="#2b3a55" font-size="15">
      <text x="34" y="34">ledger?? (2021)</text>
      <text x="34" y="64">1 army  2 van  3 defense</text>
      <text x="34" y="94">4 carry 5 jealous 6 true</text>
      <text x="34" y="124">7 garbage 8 claim 9 echo</text>
      <text x="34" y="154">10 media 11 make  12 crunch</text>
      <text x="34" y="184" fill="#a33">13-24 on other page?!</text>
    </g>
  </g>

  <!-- yellow sticky -->
  <g transform="translate(300 40) rotate(6)" filter="url(#sh)">
    <rect width="170" height="170" fill="#fde98a"/>
    <rect width="170" height="22" fill="#f6d55c" opacity=".6"/>
    <g fill="#3a3210" font-size="14">
      <text x="12" y="46">phantom - sol</text>
      <text x="12" y="72">cat drum vivid</text>
      <text x="12" y="94">ocean silk bargain</text>
      <text x="12" y="116">... slush lamp</text>
      <text x="12" y="138">(smudged) ????</text>
      <text x="12" y="160" fill="#a33">passphrase = dog's name?</text>
    </g>
  </g>

  <!-- pink sticky -->
  <g transform="translate(440 150) rotate(-14)" filter="url(#sh)">
    <rect width="130" height="130" fill="#f9b8c8"/>
    <g fill="#4a1f2b" font-size="13">
      <text x="10" y="34">metamask</text>
      <text x="10" y="56">OLD phone</text>
      <text x="10" y="78">wipe before</text>
      <text x="10" y="100">selling!!!</text>
      <text x="10" y="122">(seed = ?)</text>
    </g>
  </g>

  <!-- napkin -->
  <g transform="translate(165 235) rotate(4)" filter="url(#sh)">
    <path d="M4 6 Q120 -6 236 4 Q244 100 236 184 Q120 192 6 186 Q-4 100 4 6 Z" fill="#fffdf7" stroke="#ddd6c6"/>
    <path d="M18 18 Q120 10 222 16 Q228 96 222 172 Q120 178 18 174 Q12 96 18 18 Z" fill="none" stroke="#ece5d4" stroke-dasharray="3 3"/>
    <ellipse cx="190" cy="140" rx="34" ry="30" fill="#c89a5b" opacity=".25"/>
    <ellipse cx="190" cy="140" rx="26" ry="22" fill="none" stroke="#b07f3f" stroke-width="3" opacity=".35"/>
    <g fill="#3b3b3b" font-size="14">
      <text x="28" y="52">trezor - 24 words</text>
      <text x="28" y="78">legal winner thank year</text>
      <text x="28" y="104">wave sausage worth useful</text>
      <text x="28" y="130">legal winner thank ...</text>
      <text x="28" y="156" fill="#a33">rest in the drawer (which?)</text>
    </g>
  </g>

  <!-- small scrap -->
  <g transform="translate(30 300) rotate(12)" filter="url(#sh)">
    <rect width="120" height="60" fill="#fbf8ee"/>
    <g fill="#2b3a55" font-size="12">
      <text x="8" y="24">xpub6CUG...</text>
      <text x="8" y="46">which wallet??</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(470 290) rotate(-6)" filter="url(#sh)">
    <rect width="70" height="120" rx="10" fill="#222"/>
    <rect x="5" y="10" width="60" height="98" rx="4" fill="#3b4a5a"/>
    <text x="35" y="48" fill="#fff" font-size="9" text-anchor="middle" font-family="sans-serif">Notes</text>
    <text x="35" y="66" fill="#ffd6a0" font-size="8" text-anchor="middle" font-family="sans-serif">"seed backup"</text>
    <text x="35" y="84" fill="#ff8a8a" font-size="8" text-anchor="middle" font-family="sans-serif">battery 3%</text>
  </g>
</svg>
